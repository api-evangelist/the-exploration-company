name: The Exploration Company
description: 'The Exploration Company (TEC) is a European deep-tech space startup founded
  in July 2021 by Hélène Huby and a team of aerospace engineers from Airbus and ArianeGroup.
  Headquartered in Munich, Germany with sites in Bordeaux, Oberpfaffenhofen, Italy, France,
  Houston, and the MENA region, TEC develops Nyx, a family of modular, reusable, in-orbit
  refuelable spacecraft designed to carry cargo — and eventually humans — to low Earth
  orbit, lunar orbit, and the Moon, serving space stations and long-distance research
  missions. The company has raised a €40.5M Series A and a €150M Series B and is a
  certified B Corp. It exposes no public developer API; interfaces are provided to
  payload customers via a Payload User''s Guide.'
